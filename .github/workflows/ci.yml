name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Format repair diagnostic
        run: |
          pnpm exec prettier apps/web/src/app/api/execute/route.ts apps/web/src/app/page.tsx packages/application/src/collective-orchestration-service.ts --write
          git diff -- apps/web/src/app/api/execute/route.ts apps/web/src/app/page.tsx packages/application/src/collective-orchestration-service.ts

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build


  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build --file apps/web/Dockerfile --tag polyon:ci .
      - name: Create local env for compose
        run: cp apps/web/.env.example apps/web/.env

      - name: Validate compose file
        run: docker compose config --quiet
