name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        continue-on-error: true
        run: |
          mkdir -p ci-debug
          pnpm install --frozen-lockfile > ci-debug/install.log 2>&1
          echo $? > ci-debug/install.code

      - name: Typecheck
        continue-on-error: true
        run: |
          pnpm typecheck > ci-debug/typecheck.log 2>&1
          echo $? > ci-debug/typecheck.code

      - name: Test
        continue-on-error: true
        run: |
          pnpm test > ci-debug/test.log 2>&1
          echo $? > ci-debug/test.code

      - name: Lint
        continue-on-error: true
        run: |
          pnpm lint > ci-debug/lint.log 2>&1
          echo $? > ci-debug/lint.code

      - name: Format check
        continue-on-error: true
        run: |
          pnpm format:check > ci-debug/format.log 2>&1
          echo $? > ci-debug/format.code

      - name: Build
        continue-on-error: true
        run: |
          pnpm build > ci-debug/build.log 2>&1
          echo $? > ci-debug/build.code

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-ci-diagnostics
          path: ci-debug/

      - name: Restore quality failure
        if: always()
        run: |
          status=0
          for file in ci-debug/*.code; do
            if [ -f "$file" ] && [ "$(cat "$file")" != "0" ]; then
              status=1
            fi
          done
          exit "$status"

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build --file apps/web/Dockerfile --tag polyon:ci .
      - name: Create local env for compose
        run: cp apps/web/.env.example apps/web/.env

      - name: Validate compose file
        run: docker compose config --quiet
