name: Repair integration formatting

on:
  push:
    branches:
      - feature/core-architecture

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        if: "!startsWith(github.event.head_commit.message, 'chore: apply integration formatting')"
        run: pnpm exec prettier packages/application/src/integration-invocation-service.ts packages/application/src/polyon-composition.test.ts packages/application/src/tool-invocation-service.ts packages/integrations/src/bearer-authenticated-http-client.test.ts packages/integrations/src/bearer-authenticated-http-client.ts packages/integrations/src/google-drive-integration-adapter.test.ts packages/integrations/src/google-drive-integration-adapter.ts packages/integrations/src/integration-authorization.ts --write
      - name: Commit formatted files
        if: "!startsWith(github.event.head_commit.message, 'chore: apply integration formatting')"
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: apply integration formatting"
          git push
