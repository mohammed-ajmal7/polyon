name: One-time format fix

on:
  push:
    branches:
      - fix/embedding-public-contract

permissions:
  contents: write

jobs:
  format-fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format repository
        run: pnpm format

      - name: Commit formatted repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git add -A
          git commit -m "chore: apply repository formatting"
          git fetch origin fix/embedding-public-contract
          git rebase origin/fix/embedding-public-contract
          git push origin HEAD:fix/embedding-public-contract
