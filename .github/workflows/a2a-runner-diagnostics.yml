name: A2A Runner Diagnostics

on:
  pull_request:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Capture runner tooling
        run: |
          mkdir -p ci-debug
          {
            echo "node: $(node --version || true)"
            echo "npm: $(npm --version || true)"
            echo "corepack: $(corepack --version || true)"
            echo "pnpm: $(pnpm --version || true)"
            echo "pwd: $(pwd)"
          } > ci-debug/runner.log

      - name: Install pnpm
        continue-on-error: true
        run: |
          npm install --global pnpm@12.7.0 > ci-debug/pnpm-install.log 2>&1
          echo $? > ci-debug/pnpm-install.code

      - name: Install dependencies
        continue-on-error: true
        run: |
          pnpm install --frozen-lockfile > ci-debug/install.log 2>&1
          echo $? > ci-debug/install.code

      - name: Typecheck
        continue-on-error: true
        run: |
          pnpm typecheck > ci-debug/typecheck.log 2>&1
          echo $? > ci-debug/typecheck.code

      - name: Test
        continue-on-error: true
        run: |
          pnpm test > ci-debug/test.log 2>&1
          echo $? > ci-debug/test.code

      - name: Lint
        continue-on-error: true
        run: |
          pnpm lint > ci-debug/lint.log 2>&1
          echo $? > ci-debug/lint.code

      - name: Format
        continue-on-error: true
        run: |
          pnpm format:check > ci-debug/format.log 2>&1
          echo $? > ci-debug/format.code

      - name: Build
        continue-on-error: true
        run: |
          pnpm build > ci-debug/build.log 2>&1
          echo $? > ci-debug/build.code

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a2a-runner-diagnostics
          path: ci-debug/
