name: Format Probe

on:
  push:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier packages/application/src/a2a-server-service.ts packages/application/src/protocol-server.test.ts --write
      - run: git diff -- packages/application/src/a2a-server-service.ts packages/application/src/protocol-server.test.ts
