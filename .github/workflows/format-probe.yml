name: Format Probe

on:
  push:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier "apps/web/src/app/(workspace)" "apps/web/src/app/api/executions/[executionId]/route.ts" "apps/web/src/app/page.tsx" --write
      - run: |
          if git diff --quiet -- "apps/web/src/app/(workspace)" "apps/web/src/app/api/executions/[executionId]/route.ts" "apps/web/src/app/page.tsx"; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/web/src/app/(workspace)" "apps/web/src/app/api/executions/[executionId]/route.ts" "apps/web/src/app/page.tsx"
          git commit -m "style: format AI HQ workspace"
          git push origin HEAD:${GITHUB_REF_NAME}
