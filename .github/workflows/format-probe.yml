name: Format Probe

on:
  push:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier "apps/web/src/app/(workspace)" "apps/web/src/app/api/executions/[executionId]/route.ts" "apps/web/src/app/page.tsx" --write
      - run: git diff -- "apps/web/src/app/(workspace)" "apps/web/src/app/api/executions/[executionId]/route.ts" "apps/web/src/app/page.tsx"
