name: Repair Telegram formatting

on:
  push:
    branches:
      - feature/core-architecture

permissions:
  contents: write

jobs:
  repair:
    if: "!startsWith(github.event.head_commit.message, 'chore: apply Telegram formatting')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feature/core-architecture
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Telegram files
        run: |
          pnpm exec prettier             packages/integrations/src/bounded-http-client.ts             packages/integrations/src/telegram-integration-adapter.ts             packages/application/src/builtin-telegram-integration.integration.test.ts             --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             packages/integrations/src/bounded-http-client.ts             packages/integrations/src/telegram-integration-adapter.ts             packages/application/src/builtin-telegram-integration.integration.test.ts
          git commit -m "chore: apply Telegram formatting"
          git push origin HEAD:feature/core-architecture
