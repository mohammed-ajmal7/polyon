name: Format MCP slice once

on:
  push:
    branches:
      - feature/mcp-a2a-protocol-depth

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/mcp-a2a-protocol-depth
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and remove helper
        run: |
          set -euo pipefail
          pnpm format
          git rm .github/workflows/format-mcp-once.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: format MCP hardening slice"
          git push origin HEAD:feature/mcp-a2a-protocol-depth
