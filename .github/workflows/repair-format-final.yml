name: Repair repository formatting
# one-time trigger

on:
  push:
    branches:
      - feature/core-architecture

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feature/core-architecture

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: |
          git fetch origin feature/core-architecture
          git reset --hard origin/feature/core-architecture
          pnpm format

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: apply final repository formatting"
          git fetch origin feature/core-architecture
          git rebase origin/feature/core-architecture
          git push origin HEAD:feature/core-architecture
