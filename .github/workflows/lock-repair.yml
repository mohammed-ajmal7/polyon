name: Repair lockfile

on:
  push:
    branches:
      - ci/verify-current

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.1

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only

      - name: Commit repaired lockfile
        run: |
          rm .github/workflows/lock-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/lock-repair.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: repair generated lockfile"
          git push origin HEAD:ci/verify-current
