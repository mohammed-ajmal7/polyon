name: Repair agent integration formatting

on:
  push:
    branches:
      - feature/core-architecture

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feature/core-architecture
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format
        run: |
          git fetch origin feature/core-architecture
          git reset --hard origin/feature/core-architecture
          pnpm exec prettier             packages/application/src/agent-integration-approval.test.ts             packages/application/src/agent-tool-orchestration-service.test.ts             packages/application/src/agent-tool-orchestration-service.ts             packages/contracts/src/integration/side-effect-class.ts             packages/integrations/src/integration-adapter.ts             --write
      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             packages/application/src/agent-integration-approval.test.ts             packages/application/src/agent-tool-orchestration-service.test.ts             packages/application/src/agent-tool-orchestration-service.ts             packages/contracts/src/integration/side-effect-class.ts             packages/integrations/src/integration-adapter.ts
          git commit -m "chore: format agent integration files"
          git fetch origin feature/core-architecture
          git rebase origin/feature/core-architecture
          git push origin HEAD:feature/core-architecture
